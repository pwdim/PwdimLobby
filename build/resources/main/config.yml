# Define a tag default para quem não tem tag (É necessário que a tag esteja configurada no .tags:)
default-tag: membro
# Define o rank default para quem não tem rank(É necessário que ele esteja configurada no .ranks:)
default-rank: membro
### Todas as tags do servidor
tags:
  ## Nome da tag no /tag <nome>
  pwdim:
    ## Prioridade no tablist (Quantor menor o número mais alto fica a tag)
    priority: 0
    ## Permissão necessária para usar a tag
    permission: tag.pwdim
    ## Prefix no tag, ao entrar, etc
    prefix: '&b&lADMIN &b'
    ## Somente a cor da tag, sem o prefixo
    name-color: '&b&o'
    ## Como ela vai aparecer no /tag ou na scoreboard
    type: '&bAdmin'
  admin:
    priority: 10
    permission: tag.admin
    prefix: '&4&lADMIN &4'
    name-color: '&4&o'
    type: '&4Admin'
  modplus:
    priority: 15
    permission: tag.mod+
    prefix: '&5&lMOD+ &5'
    name-color: '&5&o'
    type: '&5Mod+'
  mod:
    priority: 20
    permission: tag.mod
    prefix: '&5&lMOD &5'
    name-color: '&5&o'
    type: '&5Mod'
  trial:
    priority: 25
    permission: tag.trial
    prefix: '&5&lTRIAL &5'
    name-color: '&5&o'
    type: '&5Trial'
  helper:
    priority: 30
    permission: tag.helper
    prefix: '&9&lHELPER &9'
    name-color: '&9&o'
    type: '&9Helper'
  ytplus:
    priority: 35
    permission: tag.yt+
    prefix: '&3&lYT+ &3'
    name-color: '&3&o'
    type: '&3YT+'
  partnerplus:
    priority: 40
    permission: tag.yt+
    prefix: '&3&lPARTNER+ &3'
    name-color: '&3&o'
    type: '&3Partner+'
  creatorplus:
    priority: 45
    permission: tag.yt+
    prefix: '&3&lCREATOR+ &3'
    name-color: '&3&o'
    type: '&3Creator+'
  yt:
    priority: 50
    permission: tag.yt
    prefix: '&b&lYT &b'
    name-color: '&b'
    type: '&bYT'
  partner:
    priority: 55
    permission: tag.partner
    prefix: '&b&lPARTNER &b'
    name-color: '&b'
    type: '&bPartner'
  creator:
    priority: 60
    permission: tag.creator
    prefix: '&b&lCREATOR &b'
    name-color: '&b'
    type: '&bCreator'
  membro:
    priority: 65
    permission: tag.membro
    prefix: '&7'
    name-color: '&7'
    type: '&7Membro'
ranks:
  pwdim:
    - '*'
    - staff.admin
    - worldedit.*
    - lobby.*
    - staff.*
    - minecraft.command.*
    - tag.pwdim
    - tag.admin
    - staff.group
    - tag.mod
  admin:
    - tag.admin
  modplus:
    - tag.mod+
  mod:
    - tag.mod
  trial:
    - tag.trial
  helper:
    - tag.helper
  ytplus:
    - tag.ytplus
  yt:
    - tag.yt
  membro:
    - tag.membro
## Configurações gerais do servidor
server:
  ## Motd na lista de servidores
  motd:
    ## Linha um do motd
    line1: §1§l§m---§9§l§m---§b§l§m--== §b§l( PWDIM )§b§l§m ==--§9§l§m---§1§l§m---§r
    ## Linha dois do motd
    line2: §4§lALPHA §eem desenvolvimento!
  ## Número máximo de jogadores
  max: 1000
  ## Mensagem enviada quando o jogador não tem permissão
  no-perm-message: '&cVocê não possui permissão para executar esse comando!'
  ## Mensagem enviada quando o comando não é encontrado
  no-cmd-message: '&cComando não encontrado'
  ## Titulo enviado ao entrar no servidor
  title: '&b&lPWDIM'
  ## SubTitulo enviado ao entrar no servidor
  subtitle: '&e&oSeja bem-vindo(a)!'
  ## Nome do mapa onde será o lobby
  lobby-world: academy
database:
  host: 'localhost'
  port: '3306'
  name: 'users'
  user: 'root'
  password: 'pwdim@com@admin'


